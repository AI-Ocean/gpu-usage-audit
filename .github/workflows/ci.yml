name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -race -v

      - name: go build
        run: go build -ldflags="-X main.version=${GITHUB_SHA::7}" -o /tmp/gpu-usage-audit .

      - name: Smoke test — version
        run: /tmp/gpu-usage-audit version
