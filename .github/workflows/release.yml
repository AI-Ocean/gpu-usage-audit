name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync --all-groups --locked

      - name: ruff check
        run: uv run ruff check

      - name: ruff format --check
        run: uv run ruff format --check

      - name: mypy
        run: uv run mypy

      - name: pytest
        run: uv run pytest -v

      - name: Validate tag version
        run: uv run python scripts/check-tag-version.py

      - name: Build sdist + wheel
        run: uv build

      - name: Smoke built wheel
        run: bash scripts/smoke-dist-wheel.sh

      - name: Generate checksums
        run: cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 이전 태그까지의 git log 추출용 — fetch-depth 0 으로 전체 history.
          fetch-depth: 0

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: List artifacts
        run: ls -la dist/

      - name: Generate release notes from git log
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # gh --generate-notes 는 PR 머지 기반이라 직접 push 한 commit 이
          # 본문에 안 들어간다. 우리는 commit 메시지가 conventional 이라
          # git log 직접 추출이 더 의미 있다.
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          {
            if [ -n "$PREV" ]; then
              echo "## Changes since $PREV"
              echo
              git log --pretty=format:"- %s (%h)" "${PREV}..${TAG}"
              echo
              echo
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV}...${TAG}"
            else
              echo "## Initial release"
              echo
              git log --pretty=format:"- %s (%h)" "${TAG}"
            fi
          } > release_notes.md
          echo "--- release_notes.md ---"
          cat release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # 알파/베타 prerelease 자동 표기 — "a" / "b" / "rc" 가 들어가면
          # GitHub Release 의 prerelease 플래그를 켠다.
          PRERELEASE_FLAG=""
          case "$TAG" in
            *a*|*b*|*rc*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.whl dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" $PRERELEASE_FLAG \
              --title "$TAG" \
              --notes-file release_notes.md \
              dist/*.whl dist/*.tar.gz dist/SHA256SUMS
          fi

  # PyPI publish — 사용자가 PyPI 측에 trusted publisher 등록한 뒤 활성화.
  # https://docs.pypi.org/trusted-publishers/
