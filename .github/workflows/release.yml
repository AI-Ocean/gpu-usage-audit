name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          BIN="gpu-usage-audit-${VERSION}-${GOOS}-${GOARCH}"
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "dist/${BIN}" .
          ( cd dist && sha256sum "${BIN}" > "${BIN}.sha256" )

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpu-usage-audit-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Extract release notes for this tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # CHANGELOG 에서 이 태그에 해당하는 entry 만 추출.
          # 형식: "## [X.Y.Z] — date" 아래부터 다음 "## " 직전까지.
          VERSION="${TAG#v}"
          # awk pattern 의 `[` 가 regex character class 로 해석되지 않도록
          # index() 로 literal prefix 매치.
          awk -v hdr="## [${VERSION}]" '
            index($0, hdr) == 1 { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No release notes found for ${TAG} in CHANGELOG.md" >&2
            exit 1
          fi
          echo "--- release_notes.md ---"
          cat release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release_notes.md \
            dist/*
