name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync --all-groups --locked

      - name: Build sdist + wheel
        run: uv build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: List artifacts
        run: ls -la dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # 알파/베타 prerelease 자동 표기 — "a" / "b" / "rc" 가 들어가면
          # GitHub Release 의 prerelease 플래그를 켠다.
          PRERELEASE_FLAG=""
          case "$TAG" in
            *a*|*b*|*rc*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          # --generate-notes: 이전 태그 이후의 commit 메시지로 release notes
          # 자동 생성. CHANGELOG 수동 유지 부담 ↓, commit 메시지가 source
          # of truth.
          gh release create "$TAG" $PRERELEASE_FLAG \
            --title "$TAG" \
            --generate-notes \
            dist/*

  # PyPI publish — 사용자가 PyPI 측에 trusted publisher 등록한 뒤 활성화.
  # https://docs.pypi.org/trusted-publishers/
