[project]
name = "gpu-usage-audit"
version = "0.4.1"
description = "Single-host daemon that surfaces 'idle-held' NVIDIA GPU memory — the embarrassing category conventional dashboards miss."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "AI-Ocean" }]
keywords = ["gpu", "monitoring", "nvidia", "idle-detection", "sqlite"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]
# 코어 런타임 의존성 0 (sqlite3 는 stdlib). FakeTier 로 GPU 없이도 동작.
# 실 NVIDIA GPU 텔레메트리를 보려면 `[nvml]` extra 를 같이 설치 — 아래.
dependencies = []

[project.optional-dependencies]
# 진짜 GPU 환경에서만 의미 있는 의존성.
# 설치: `uv pip install gpu-usage-audit[nvml]` 또는
#       `pip install gpu-usage-audit[nvml]`
# uv tool 동선: `uv tool install --with nvidia-ml-py gpu-usage-audit`
nvml = ["nvidia-ml-py>=12.535"]

[project.scripts]
# pip / uvx 가 만들 entry point. `uvx gpu-usage-audit ...` 한 줄로 실행.
gpu-usage-audit = "gpu_usage_audit.__main__:main"
gua = "gpu_usage_audit.__main__:gua_main"

[project.urls]
Homepage = "https://github.com/AI-Ocean/gpu-usage-audit"
Issues = "https://github.com/AI-Ocean/gpu-usage-audit/issues"
Releases = "https://github.com/AI-Ocean/gpu-usage-audit/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpu_usage_audit"]

# ── 개발 도구 의존성 ─────────────────────────────────────────────
# `uv sync --group dev` 또는 `uv run pytest` 등에서 자동 사용.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    # dev 환경에서 NVMLTier 의 변환 로직을 *모킹으로* 검증할 수 있게
    # import 자체는 가능해야 함 (실제 nvmlInit 은 GPU 없는 머신에서 실패).
    "nvidia-ml-py>=12.535",
]

# ── pytest ──────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

# ── ruff (lint + format 한 도구로) ───────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# 시작 셋트 — 너무 빡빡하지 않게. 필요에 따라 추가.
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line-too-long (formatter 가 처리)
    "RUF001", # string literal 안 비-ASCII (§1–§5 의 en-dash 등) — 의도된 표기.
    "RUF002", # docstring 안 비-ASCII (한국어 — em-dash 등) — 의도된 표기.
    "RUF003", # 주석 안 비-ASCII (`×` 곱셈 등) — 의도된 표기.
]

[tool.ruff.format]
quote-style = "double"

# ── mypy (strict, 학습 가치) ─────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# pynvml (nvidia-ml-py) 은 type stub 없음 — strict 모드에서 미사용 처리.
module = ["pynvml"]
ignore_missing_imports = true
