[project]
name = "gpu-usage-audit"
version = "1.7.2"
description = "Single-host daemon that surfaces 'idle-held' NVIDIA GPU memory — the embarrassing category conventional dashboards miss."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "AI-Ocean" }]
keywords = ["gpu", "monitoring", "nvidia", "idle-detection", "sqlite"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]
# NVML Python binding is a default dependency for the bare-metal 1.0 UX.
# GPU 없는 개발/CI/demo 환경에서도 import 는 가능하고, driver/NVML init 만 실패한다.
# websockets: 보드 라이브 util 스트림(0032-2) 용 — stdlib 에 ws 클라이언트가 없다.
dependencies = ["nvidia-ml-py>=12.535", "websockets>=13"]

[project.optional-dependencies]
# Backward-compatible alias. NVML is now installed by default.
nvml = []

[project.scripts]
# `gua` is the canonical CLI; `gpu-usage-audit` remains as a compatibility alias.
gpu-usage-audit = "gpu_usage_audit.__main__:main"
gua = "gpu_usage_audit.__main__:gua_main"

[project.urls]
Homepage = "https://github.com/AI-Ocean/gpu-usage-audit"
Issues = "https://github.com/AI-Ocean/gpu-usage-audit/issues"
Releases = "https://github.com/AI-Ocean/gpu-usage-audit/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpu_usage_audit"]

# ── 개발 도구 의존성 ─────────────────────────────────────────────
# `uv sync --group dev` 또는 `uv run pytest` 등에서 자동 사용.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
]

# ── pytest ──────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

# ── ruff (lint + format 한 도구로) ───────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# 시작 셋트 — 너무 빡빡하지 않게. 필요에 따라 추가.
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line-too-long (formatter 가 처리)
    "RUF001", # string literal 안 비-ASCII (§1–§5 의 en-dash 등) — 의도된 표기.
    "RUF002", # docstring 안 비-ASCII (한국어 — em-dash 등) — 의도된 표기.
    "RUF003", # 주석 안 비-ASCII (`×` 곱셈 등) — 의도된 표기.
]

[tool.ruff.format]
quote-style = "double"

# ── mypy (strict, 학습 가치) ─────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# pynvml (nvidia-ml-py) 은 type stub 없음 — strict 모드에서 미사용 처리.
module = ["pynvml"]
ignore_missing_imports = true
